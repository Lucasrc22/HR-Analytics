{% extends "base.html" %}

{% block title %}Editar Vaga{% endblock %}

{% block content %}
  <style>
    .form-container {
      max-width: 600px;
      margin: 40px auto;
      background-color: #FFFFFF;
      padding: 30px;
      border-radius: 10px;
      border-left: 4px solid #285959;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .form-container h1 {
      color: #285959;
      margin-bottom: 20px;
    }

    .form-container form {
      display: flex;
      flex-direction: column;
    }

    .form-container input,
    .form-container select,
    .form-container textarea {
      margin-bottom: 15px;
      padding: 10px;
      border: 1px solid #CED7D7;
      border-radius: 4px;
      font-size: 14px;
    }

    .form-container input:focus,
    .form-container select:focus,
    .form-container textarea:focus {
      outline: none;
      border-color: #285959;
      box-shadow: 0 0 5px rgba(40, 89, 89, 0.3);
    }

    .form-container button {
      background-color: #285959;
      color: #FFFFFF;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .form-container button:hover {
      background-color: #A4C0B0;
      color: #285959;
    }
  </style>

  <div class="form-container">
    <h1>Editar Vaga</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Salvar</button>
    </form>
  </div>
{% endblock %}
