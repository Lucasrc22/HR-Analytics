# Reverse proxy para a aplicação Django (gunicorn no serviço "web").
upstream django_app {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Tamanho máximo de upload (ajuste conforme necessidade de anexos/CAT).
    client_max_body_size 20M;

    # Cabeçalhos de segurança.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Não expõe a versão do nginx.
    server_tokens off;

    # Arquivos estáticos servidos direto pelo nginx (volume compartilhado).
    location /static/ {
        alias /app/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Demais requisições vão para o gunicorn.
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
