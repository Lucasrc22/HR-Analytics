services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: hr-analytics-web:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: app.settings
    # Sem "ports": a app NÃO é exposta ao host, só o nginx fala com ela.
    expose:
      - "8000"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    networks:
      - appnet
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/').status < 500 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      # 8004 escolhida por estar LIVRE no servidor.
      # Em uso: 8000,8001,8002,8003,8006,8080,8502,8503,9443,5432,6379.
      - "8004:80"
      # - "443:443"   # 443 está livre; habilite ao configurar TLS
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    networks:
      - appnet
    security_opt:
      - no-new-privileges:true

networks:
  # Bridge (não-interna) para que o "web" alcance o Oracle na sua LAN.
  appnet:
    driver: bridge

volumes:
  static_volume:
  media_volume:
