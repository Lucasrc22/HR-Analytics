{% extends "base.html" %}

{% block title %}Exportar Treinamentos{% endblock %}

{% block content %}
  <style>
    .export-card {
      max-width: 500px;
      margin: 60px auto;
      background-color: #FFFFFF;
      padding: 40px 30px;
      border-radius: 10px;
      border-left: 4px solid #285959;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .export-card h1 {
      color: #285959;
      margin-bottom: 10px;
    }

    .export-card p {
      color: #555;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      background-color: #285959;
      color: #FFFFFF;
      padding: 12px 22px;
      border-radius: 4px;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #A4C0B0;
      color: #285959;
    }

    .btn-back {
      display: inline-block;
      margin-top: 18px;
      color: #285959;
      text-decoration: none;
      font-size: 14px;
    }

    .btn-back:hover {
      text-decoration: underline;
    }
  </style>

  <div class="export-card">
    <h1>Arquivo gerado</h1>
    <p>Sua exportação está pronta para download.</p>
    <a href="{% url 'treinamento_download' file_path %}" class="btn">⭳ Baixar planilha</a>
    <br>
    <a href="{% url 'treinamento_list' %}" class="btn-back">← Voltar para a lista</a>
  </div>
{% endblock %}
